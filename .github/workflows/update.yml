name: Daily price + earnings update

on:
  schedule:
    # 18:30 Dubai (14:30 UTC) — US market open: intraday prices, catches pre-market reports
    - cron: "30 14 * * *"
    # 06:00 Dubai (02:00 UTC) — after the US close: catches after-hours reports the same night
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices
        run: node scripts/update-prices.mjs

      - name: Refresh earnings (holdings + peers)
        run: node scripts/update-fundamentals.mjs

      - name: Rebuild index + sector multiples (bottom-up)
        run: node scripts/update-indices.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data/fiscal-years.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Data update $(TZ=Asia/Dubai date '+%Y-%m-%d %H:%M') Dubai"
            git pull --rebase
            git push
          fi
